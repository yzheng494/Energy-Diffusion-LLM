hydra:
  run:
    dir: outputs/arebm_owt_ckpt_quant_multiseed_analysis
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.run.dir=outputs/arebm_owt_ckpt_quant_multiseed_analysis
    - hydra.mode=RUN
    task:
    - loader.batch_size=1
    - loader.eval_batch_size=1
    - data=openwebtext-split
    - model=small
    - parameterization=subs
    - ebm_backbone=ar
    - model.length=1024
    - T=0
    - +wandb.offline=true
    - +num_seeds=8
    - +quant_types=[fp4,fp8,int8,nf4]
    - +ppl_log_every=10
    - +use_real_quant=true
  job:
    name: multiseed_analysis
    chdir: true
    override_dirname: +num_seeds=8,+ppl_log_every=10,+quant_types=[fp4,fp8,int8,nf4],+use_real_quant=true,+wandb.offline=true,T=0,data=openwebtext-split,ebm_backbone=ar,loader.batch_size=1,loader.eval_batch_size=1,model.length=1024,model=small,parameterization=subs
    id: ???
    num: ???
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /localscratch/yzheng494/Energy-Diffusion-LLM
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /localscratch/yzheng494/Energy-Diffusion-LLM/configs
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /localscratch/yzheng494/Energy-Diffusion-LLM/outputs/arebm_owt_ckpt_quant_multiseed_analysis
    choices:
      lr_scheduler: constant_warmup
      noise: loglinear
      strategy: ddp
      model: small
      data: openwebtext-split
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
